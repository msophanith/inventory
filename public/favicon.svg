<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cartGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>

  <!-- Cart Body (Glassmorphism & Glow) -->
  <g filter="url(#glow)">
    <!-- Cart Handle & Base outline -->
    <path d="M 100 140 L 140 140 L 190 320 L 390 320 A 20 20 0 0 0 410 300 L 440 180 L 160 180" fill="none" stroke="url(#cartGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Cart wheels -->
    <circle cx="210" cy="380" r="24" fill="#10b981"/>
    <circle cx="370" cy="380" r="24" fill="#6366f1"/>
    
    <!-- Stock Box 1 inside cart -->
    <rect x="200" y="200" width="80" height="70" rx="12" fill="#0ea5e9" opacity="0.85"/>
    <line x1="240" y1="200" x2="240" y2="270" stroke="#ffffff" stroke-width="4" opacity="0.6"/>

    <!-- Stock Box 2 inside cart -->
    <rect x="290" y="170" width="90" height="100" rx="12" fill="#10b981" opacity="0.9"/>
    <line x1="335" y1="170" x2="335" y2="270" stroke="#ffffff" stroke-width="4" opacity="0.6"/>

    <!-- Scanner Beam -->
    <line x1="120" y1="130" x2="420" y2="260" stroke="url(#laserGrad)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="120" cy="130" r="14" fill="#22d3ee"/>
  </g>
</svg>